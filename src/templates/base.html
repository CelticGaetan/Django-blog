{% load static %}

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="{% static 'css/style_blog.css' %}">

{% block title %}
<title> Accueil du blog</title>
{% endblock %}
</head>


<body>

<article id="blog">
{% block content %}


{% endblock %}

</article>    


</body>
</html>
